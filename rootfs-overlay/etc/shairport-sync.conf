// TarsOS: receptor AirPlay. Toca no alto-falante do Echo Show 5 (RT5616, hw:0,23).
general = {
	name = "TarsOS";
	output_backend = "stdout";
	mdns_backend = "avahi";
	volume_range_db = 50;
	allow_session_interruption = "yes";
};
// Saída: stdout -> aplay (ver /usr/local/bin/airplay-run). Escrever direto no ALSA
// derruba o kernel por um bug do driver da MediaTek com escritas fora de múltiplos de 64 bytes.
stdout = {
};
metadata = {
	enabled = "yes";
	include_cover_art = "yes";
	cover_art_cache_directory = "/run/luizinhoshowos/airplay-covers";
	pipe_name = "/run/luizinhoshowos/airplay-metadata";
	pipe_timeout = 5000;
};
